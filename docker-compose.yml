services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data

  checkout-service:
    build:
      context: .
      dockerfile: deploy/demo-app/Dockerfile
    environment:
      COMPONENT_NAME: checkout-service
      COMPONENT_TYPE: app-server
      BACKEND_ENDPOINT: backend:8080
      POLL_INTERVAL: 3s
    depends_on:
      - backend

  orders-worker:
    build:
      context: .
      dockerfile: deploy/demo-app/Dockerfile
    environment:
      COMPONENT_NAME: orders-worker
      COMPONENT_TYPE: message-queue
      BACKEND_ENDPOINT: backend:8080
      POLL_INTERVAL: 3s
    depends_on:
      - backend

  session-cache:
    build:
      context: .
      dockerfile: deploy/demo-app/Dockerfile
    environment:
      COMPONENT_NAME: session-cache
      COMPONENT_TYPE: cache
      BACKEND_ENDPOINT: backend:8080
      POLL_INTERVAL: 3s
    depends_on:
      - backend

  # A real Kafka broker (KRaft, single node) with the distviz agent running
  # inside the same container, scraping the broker's own JMX metrics (via
  # the Prometheus JMX exporter javaagent) for live throughput.
  kafka:
    build:
      context: .
      dockerfile: deploy/kafka/Dockerfile
    ports:
      - "29092:29092"
    environment:
      COMPONENT_NAME: kafka-broker
      BACKEND_ENDPOINT: backend:8080
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for traffic within the compose network (other containers,
      # e.g. kafka-load, reach it as kafka:9092). HOST is a second listener
      # just for host-machine clients, advertised as localhost:29092 since
      # "kafka" doesn't resolve outside the compose network.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - backend

  # Produces a steady trickle of messages so the Kafka throughput metrics on
  # the dashboard have something to show without manual intervention.
  kafka-load:
    image: apache/kafka:latest
    entrypoint: ["bash", "-c"]
    command:
      - |
        sleep 20
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic load-test --partitions 3 --replication-factor 1
        while true; do
          /opt/kafka/bin/kafka-producer-perf-test.sh --topic load-test --num-records 20000 --record-size 512 --throughput 2000 --producer-props bootstrap.servers=kafka:9092
          sleep 5
        done
    depends_on:
      - kafka

volumes:
  backend-data:
