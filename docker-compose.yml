services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/data

  checkout-service:
    build:
      context: .
      dockerfile: deploy/demo-app/Dockerfile
    environment:
      COMPONENT_NAME: checkout-service
      COMPONENT_TYPE: app-server
      BACKEND_ENDPOINT: backend:8080
      POLL_INTERVAL: 3s
      # Periodically calls java-api so a real dependency edge shows up on
      # the dashboard (checkout-service -> java-api).
      CALL_TARGET: http://java-api:8080/api/orders/1
    depends_on:
      - backend
      - java-api

  orders-worker:
    build:
      context: .
      dockerfile: deploy/demo-app/Dockerfile
    environment:
      COMPONENT_NAME: orders-worker
      COMPONENT_TYPE: message-queue
      BACKEND_ENDPOINT: backend:8080
      POLL_INTERVAL: 3s
    depends_on:
      - backend

  session-cache:
    build:
      context: .
      dockerfile: deploy/demo-app/Dockerfile
    environment:
      COMPONENT_NAME: session-cache
      COMPONENT_TYPE: cache
      BACKEND_ENDPOINT: backend:8080
      POLL_INTERVAL: 3s
    depends_on:
      - backend

  # A real Kafka broker (KRaft, single node) with the distviz agent running
  # inside the same container, scraping the broker's own JMX metrics (via
  # the Prometheus JMX exporter javaagent) for live throughput.
  kafka:
    build:
      context: .
      dockerfile: deploy/kafka/Dockerfile
    ports:
      - "29092:29092"
    environment:
      COMPONENT_NAME: kafka-broker
      BACKEND_ENDPOINT: backend:8080
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for traffic within the compose network (other containers,
      # e.g. kafka-load, reach it as kafka:9092). HOST is a second listener
      # just for host-machine clients, advertised as localhost:29092 since
      # "kafka" doesn't resolve outside the compose network.
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - backend

  # Produces a steady trickle of messages (feeding the Kafka throughput
  # metrics) and, via edgeclient.Reporter, reports a kafka-producer ->
  # kafka-broker dependency edge on every send.
  kafka-producer:
    build:
      context: .
      dockerfile: deploy/kafka-client/Dockerfile
    environment:
      COMPONENT_NAME: kafka-producer
      COMPONENT_TYPE: app-server
      BACKEND_ENDPOINT: backend:8080
      MODE: produce
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: load-test
      KAFKA_BROKER_COMPONENT: kafka-broker
    depends_on:
      - kafka
      - backend

  # Consumes those same messages and reports a kafka-consumer ->
  # kafka-broker edge, so the dashboard shows both directions of Kafka
  # traffic (produce and consume are two independent TCP dependencies on
  # the broker, not a single shared edge).
  kafka-consumer:
    build:
      context: .
      dockerfile: deploy/kafka-client/Dockerfile
    environment:
      COMPONENT_NAME: kafka-consumer
      COMPONENT_TYPE: app-server
      BACKEND_ENDPOINT: backend:8080
      MODE: consume
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: load-test
      KAFKA_BROKER_COMPONENT: kafka-broker
    depends_on:
      - kafka
      - backend
      - kafka-producer

  # A real Spring Boot REST API with the distviz agent running inside the
  # same container, scraping the app's own Micrometer/Actuator Prometheus
  # endpoint for live HTTP request-rate and in-flight-request metrics.
  # Calls inventory-service on every order creation (via EdgeReporter, a
  # Java port of sdk/edgeclient), reporting a java-api -> inventory-service
  # edge the same way the Go components report theirs.
  java-api:
    build:
      context: .
      dockerfile: deploy/java-api/Dockerfile
    ports:
      - "18080:8080"
    environment:
      COMPONENT_NAME: java-api
      BACKEND_ENDPOINT: backend:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080/api/inventory
    depends_on:
      - backend
      - inventory-service

  # A second, independent Spring Boot service that java-api calls - exists
  # purely to demonstrate a Java-to-Java dependency edge alongside the
  # checkout-service -> java-api one.
  inventory-service:
    build:
      context: .
      dockerfile: deploy/inventory-service/Dockerfile
    environment:
      COMPONENT_NAME: inventory-service
      BACKEND_ENDPOINT: backend:8080
    depends_on:
      - backend

  # Continuously calls the java-api's REST endpoints so the HTTP
  # request-rate metric on the dashboard has something to show.
  java-load:
    image: curlimages/curl:8.11.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 15
        i=0
        while true; do
          i=$$((i+1))
          curl -s -o /dev/null http://java-api:8080/api/orders/$$i
          if [ $$((i % 5)) -eq 0 ]; then
            curl -s -o /dev/null -X POST http://java-api:8080/api/orders
          fi
          sleep 0.2
        done
    depends_on:
      - java-api

volumes:
  backend-data:
