# Maps the Kafka broker JMX MBeans we care about onto clean Prometheus
# metric names, scraped by the distviz agent's Prometheus-scrape collector
# (see agent/main.go promMetricSets["kafka"]).
lowercaseOutputName: true
rules:
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=MessagesInPerSec><>OneMinuteRate'
    name: kafka_messages_in_per_second
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesInPerSec><>OneMinuteRate'
    name: kafka_bytes_in_per_second
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=BytesOutPerSec><>OneMinuteRate'
    name: kafka_bytes_out_per_second
